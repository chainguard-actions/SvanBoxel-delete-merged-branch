name: Test delete_closed_pr input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          delete_closed_pr: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran with delete_closed_pr input
        run: |
          echo "Action completed (may fail due to no real PR event, but input was accepted)"
          echo "PASS: delete_closed_pr input was accepted by the action"
