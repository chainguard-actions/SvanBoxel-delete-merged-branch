name: Test delete_closed_pr input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          delete_closed_pr: "true"
        continue-on-error: true
      - name: Assert action ran (delete_closed_pr input accepted)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action may fail due to missing GitHub token/event payload in local act environment,
          # but we verify it was invoked with the delete_closed_pr input without crashing on input parsing.
          # A 'success' or 'failure' (not 'skipped') means the action was reached.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with delete_closed_pr input"
